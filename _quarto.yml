project:
  type: website
  render:
    - 404.qmd
    - index.qmd
    - general/scientific-writing.qmd
    - workshops/literature-research.qmd
    - workshops/prompting.qmd
    - workshops/git-github.qmd
    - workshops/large-language-models.qmd
    - workshops/quarto-academic-writing.qmd
    - general/templates.qmd
    - general/literature.qmd
    - general/privacy.qmd
    - general/imprint.qmd
    - general/faq.qmd
  resources:
    - templates/seminar-paper-en.qmd
    - templates/seminar-paper-de.qmd
    - templates/Template.tex
    - templates/Vorlage.tex
    - templates/references.bib
    - templates/typst-show.typ
    - templates/images/Image.pdf

website:
  favicon: images/favicon.svg
  title: "Scientific Research Workshops"
  repo-url: https://github.com/beyondsimulations/Scientific-Research-Workshops
  repo-branch: main
  repo-actions: [edit, source, issue]
  site-url: https://beyondsimulations.github.io/Scientific-Research-Workshops
  bread-crumbs: true
  sidebar:
    style: floating
    logo:
      light: images/course-logo.svg
      dark: images/course-logo-dark.svg
    logo-alt: "Scientific Research Workshops"
    collapse-level: 1
    search: true
    contents:
      - text: "Welcome"
        href: index.qmd
      - text: "***"
      - text: "Scientific Writing"
        href: general/scientific-writing.qmd
      - text: "Literature Research"
        href: workshops/literature-research.qmd
      - text: "Working with AI"
        href: workshops/large-language-models.qmd
      - text: "AI Prompting"
        href: workshops/prompting.qmd
      - text: "Git & GitHub"
        href: workshops/git-github.qmd
      - text: "Quarto"
        href: workshops/quarto-academic-writing.qmd
      - text: "***"
      - text: "Templates"
        href: general/templates.qmd
      - text: "Resources"
        href: general/literature.qmd
      - text: "FAQs"
        href: general/faq.qmd

  page-footer:
    center: "Scientific Research Workshops, Prof. Dr. Knut Haase & Dr. Tobias Vlćek<br>CC BY-SA 4.0"
    left:
      - icon: github
        href: https://github.com/beyondsimulations/Scientific-Research-Workshops
        aria-label: GitHub repository
      - icon: linkedin
        href: https://linkedin.com/in/tobiasvlcek
        aria-label: LinkedIn
      - icon: envelope
        href: mailto:tobias.vlcek@uni-hamburg.de
        aria-label: Email
      - icon: skip-backward
        href: https://tobiasvlcek.com/lectures/
        aria-label: All lectures
      - icon: shield-check
        href: general/privacy.qmd
        aria-label: Privacy policy
      - icon: info-circle
        href: general/imprint.qmd
        aria-label: Imprint

format:
  html:
    format-links: false
    theme:
      light:
        - default
        - styles.scss
        - brand
      dark:
        - default
        - _dark.scss
        - styles.scss
        - brand
    respect-user-color-scheme: true
    toc: true
    syntax-highlighting:
      light: _paper-and-ink-light.theme
      dark: _paper-and-ink-dark.theme
    callout-appearance: simple
    code-copy: true
    code-link: true
    toc-location: right
    code-overflow: wrap
    include-in-header:
      - general/header.html
      - general/favicon.html
    include-after-body:
      text: |
        <script defer src="https://oshu.eu/widget.js"></script>
        <script>
          document.addEventListener('DOMContentLoaded', function () {
            ChatWidget.init({
              tenant: "platform",
              agent: "thesis-helper",
              layoutMode: "sidebar",
            });
          });
        </script>

execute:
  freeze: auto

brand: _brand.yml

filters:
  - helpers/page-pauses.lua
